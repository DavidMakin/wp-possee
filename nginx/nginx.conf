pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    fastcgi_cache_path /tmp/nginx-cache levels=1:2 keys_zone=wordpress:100m inactive=60m max_size=512m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml image/svg+xml font/woff font/woff2;

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    server {
        listen 80;
        server_name _;

        root /var/www/html;
        index index.php;

        client_max_body_size 10M;

        resolver 127.0.0.11 ipv6=off valid=30s;

        add_header X-Content-Type-Options  "nosniff"          always;
        add_header X-Frame-Options         "SAMEORIGIN"       always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src 'self'" always;

        set $skip_cache 0;

        if ($request_method = POST)                                            { set $skip_cache 1; }
        if ($request_uri ~* "/wp-admin/|/wp-login\.php|/feed/|/sitemap")      { set $skip_cache 1; }
        if ($http_cookie ~* "wordpress_logged_in|comment_author|wp-postpass") { set $skip_cache 1; }
        if ($http_user_agent ~* "bridgy|brid\.gy")                            { set $skip_cache 1; }

        location = /xmlrpc.php {
            deny all;
        }

        location = /wp-login.php {
            limit_req zone=login burst=3 nodelay;
            include fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 60;
        }

        location = /webmention {
            try_files $uri $uri/ /index.php?$args;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~* /wp-content/uploads/.*\.php$ {
            deny all;
        }

        location ~ ^/(index|wp-cron|wp-comments-post)\.php$ {
            include fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 60;

            fastcgi_cache wordpress;
            fastcgi_cache_valid 200 301 302 60m;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;

            add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
            add_header X-FastCGI-Cache $upstream_cache_status always;
        }

        location ~ ^/wp-admin/.*\.php$ {
            include fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 120;
        }

        location ~ \.php$ {
            deny all;
        }

        location ~ /\.ht {
            deny all;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
            expires max;
            log_not_found off;
        }
    }
}
